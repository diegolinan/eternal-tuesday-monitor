name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - name: Enforce append-only observation ledger on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run data:validate -- --base "origin/$BASE_REF"
      - name: Enforce append-only observation ledger on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: npm run data:validate -- --base "$BASE_SHA"
      - run: npm run data:compile
      - run: git diff --exit-code -- public/data/monitor.json
      - run: npm test
      - run: npm run lint
      - run: npm run build:pages
      - run: npm run static:validate
