name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run models:catalog:sync
      - run: git diff --exit-code -- data/catalog/models.json
      - name: Enforce append-only ledgers on pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run data:validate -- --base "origin/$BASE_REF"
      - name: Enforce append-only ledgers on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: npm run data:validate -- --base "$BASE_SHA"
      - name: Verify the committed projection at its declared date
        shell: bash
        run: |
          as_of="$(node -p "JSON.parse(require('fs').readFileSync('public/data/monitor.json', 'utf8')).freshnessEvaluatedOn")"
          npm run data:compile -- --as-of "$as_of"
          git diff --exit-code -- public/data/monitor.json public/data/changelog.json public/data/model-options.json
      - run: npm test
      - run: npm run lint
      - run: npm run build:pages
      - run: npm run static:validate
