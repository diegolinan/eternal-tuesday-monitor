name: Review a public evidence submission

on:
  repository_dispatch:
    types: [public-evidence-submission]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: public-evidence-submission
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and stage the untrusted submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMISSION_JSON: ${{ toJSON(github.event.client_payload) }}
        run: node scripts/evidence-discovery/stage-submission.mjs
      - run: npm run data:validate -- --base HEAD
      - run: npm test
      - name: Confirm review labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notifications/ensure-labels.mjs community-lead review-required
      - name: Propose the candidate for human review
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/community-evidence-${{ github.event.client_payload.receiptId }}
          delete-branch: true
          title: 'Review community evidence lead ${{ github.event.client_payload.receiptId }}'
          commit-message: 'Propose a community evidence candidate'
          body-path: .submission-pr-body.md
          draft: false
          reviewers: diegolinan
          labels: |
            community-lead
            review-required
          add-paths: data/evidence-discovery/candidates.jsonl
