name: Deploy contribution intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - worker/intake.mjs
      - wrangler.intake.jsonc

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.INTAKE_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy the validated intake Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run intake:deploy
