name: Deploy contribution intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-intake.yml
      - worker/intake.mjs
      - lib/public-source-url.mjs
      - schemas/public-submission.schema.json
      - scripts/evidence-discovery/stage-submission.mjs
      - .github/workflows/intake-evidence.yml
      - wrangler.intake.jsonc

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.INTAKE_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate and check Worker binding types
        run: |
          npm run intake:types
          npx tsc --noEmit
      - name: Prepare Worker secrets for deployment
        shell: bash
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          GITHUB_REPOSITORY_TOKEN: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$TURNSTILE_SECRET_KEY" || -z "$GITHUB_REPOSITORY_TOKEN" ]]; then
            echo "Required Worker deployment secrets are not configured." >&2
            exit 1
          fi
          umask 077
          printf 'TURNSTILE_SECRET_KEY=%s\nGITHUB_REPOSITORY_TOKEN=%s\n' \
            "$TURNSTILE_SECRET_KEY" \
            "$GITHUB_REPOSITORY_TOKEN" \
            > "$RUNNER_TEMP/intake.secrets"
      - name: Deploy the validated intake Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.intake.jsonc --secrets-file "$RUNNER_TEMP/intake.secrets"
      - name: Remove temporary Worker secrets file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/intake.secrets"
