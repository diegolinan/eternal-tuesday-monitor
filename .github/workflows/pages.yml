name: Deploy GitHub Pages production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run data:compile
      - run: git diff --exit-code -- public/data/monitor.json
      - run: npm test
      - name: Evaluate freshness for the deployment date
        shell: bash
        run: |
          today="$(date -u +%F)"
          as_of="$(node scripts/resolve-evaluation-date.mjs --today "$today")"
          npm run data:compile -- --as-of "$as_of"
          npm run models:targets -- --as-of "$as_of"
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-model-probe-targets
          path: .discovery/probe-targets.json
          include-hidden-files: true
      - run: npm run build:pages
      - run: npm run static:validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
