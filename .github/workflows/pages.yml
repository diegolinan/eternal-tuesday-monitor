name: Deploy GitHub Pages production

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Discover official model changes']
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run models:catalog:sync
      - run: git diff --exit-code -- data/catalog/models.json
      - run: npm run data:compile
      - run: git diff --exit-code -- public/data/monitor.json public/data/changelog.json
      - run: npm test
      - name: Compile neutral public status
        env:
          SYSTEM_STATUS_TOKEN: ${{ github.token }}
          SYSTEM_STATUS_REPOSITORY: ${{ github.repository }}
        run: npm run status:compile
      - name: Resolve latest completed source check
        id: latest-discovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          record="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/discover-models.yml/runs?status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0] | [.id, .updated_at] | @tsv')"
          IFS=$'\t' read -r run_id completed_at <<< "$record"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
      - name: Read latest model-level source checks
        if: steps.latest-discovery.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: official-model-discovery-sources
          path: .latest-discovery
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest-discovery.outputs.run_id }}
      - name: Read latest public evidence search
        if: steps.latest-discovery.outputs.run_id != ''
        id: evidence-artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: public-evidence-search
          path: .latest-evidence
          github-token: ${{ github.token }}
          run-id: ${{ steps.latest-discovery.outputs.run_id }}
      - name: Compile per-model public status
        if: steps.latest-discovery.outputs.run_id != ''
        run: npm run model-status:compile -- --report .latest-discovery --completed-at "${{ steps.latest-discovery.outputs.completed_at }}"
      - name: Compile neutral public evidence-search status
        if: steps.evidence-artifact.outcome == 'success'
        run: npm run evidence:status -- --report .latest-evidence
      - name: Evaluate freshness for the deployment date
        shell: bash
        run: |
          today="$(date -u +%F)"
          as_of="$(node scripts/resolve-evaluation-date.mjs --today "$today")"
          npm run data:compile -- --as-of "$as_of"
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_CONTRIBUTION_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTRIBUTION_ENDPOINT }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - run: npm run static:validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy production
        id: deployment
        uses: actions/deploy-pages@v4
