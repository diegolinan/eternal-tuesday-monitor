name: Discover official model changes

on:
  schedule:
    - cron: '43 12 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: model-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the previous successful source snapshot
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/discover-models.yml/runs?status=completed&per_page=20" --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name official-model-discovery-sources --dir .prior-discovery
          fi
      - run: npm run data:validate
      - name: Read approved official sources only
        run: npm run models:discover -- --prior-report .prior-discovery
      - name: Search public evidence channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: npm run evidence:discover
      - name: Preserve raw source snapshots and normalized report
        uses: actions/upload-artifact@v4
        with:
          name: official-model-discovery-sources
          path: .discovery
          include-hidden-files: true
          retention-days: 90
      - name: Preserve evidence-search report
        uses: actions/upload-artifact@v4
        with:
          name: public-evidence-search
          path: .evidence-discovery
          include-hidden-files: true
          retention-days: 90
      - name: Stage deterministic automatic acceptances
        run: npm run models:stage -- --mode automatic
      - name: Resolve model evaluation adoption eligibility
        run: npm run models:adopt -- --report .discovery/run.json
      - name: Preserve non-executing evaluation requirements
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-adoption
          path: .evaluation
          include-hidden-files: true
          retention-days: 90
      - name: Validate deterministic result
        run: |
          npm run data:validate -- --base HEAD
          npm run data:compile
          npm test
          npm run lint
          npm run build:pages
          npm run static:validate
      - name: Detect automatic changes
        id: automatic
        shell: bash
        run: |
          if git diff --quiet -- data/catalog/models.json data/model-discovery/events.jsonl data/model-evaluation/adoption.json data/state-events/events.jsonl data/changelog/events.jsonl public/data/monitor.json public/data/changelog.json; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit deterministic catalog discoveries to main
        if: steps.automatic.outputs.deploy == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog/models.json data/model-discovery/events.jsonl data/model-discovery/source-checks.jsonl data/model-evaluation/adoption.json data/state-events/events.jsonl data/changelog/events.jsonl public/data/monitor.json public/data/changelog.json
          git commit -m "Update official model discovery and adoption state"
          git push origin HEAD:main
      - name: Stage review-required changes separately
        run: npm run models:stage -- --mode review
      - name: Validate review proposal when present
        run: |
          npm run data:validate -- --base HEAD
          npm run data:compile
      - name: Add workflow summary
        shell: bash
        run: |
          cat .discovery/automatic-summary.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat .discovery/review-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Propose ambiguous or interpretive changes for review
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: automation/model-discovery
          title: 'Review official model discovery candidates'
          commit-message: 'Propose review-required official model metadata'
          body-path: .discovery/pr-body.md
          draft: false
          reviewers: diegolinan
          add-paths: |
            data/catalog/models.json
            data/model-discovery/events.jsonl
            data/state-events/events.jsonl
            data/changelog/events.jsonl
            public/data/monitor.json
            public/data/changelog.json
      - name: Stage new evidence leads separately
        run: npm run evidence:stage
      - name: Validate evidence proposal when present
        run: npm run data:validate -- --base HEAD
      - name: Propose evidence candidates for review
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: automation/evidence-candidates
          title: 'Review public evidence candidates'
          commit-message: 'Propose public evidence candidates'
          body-path: .evidence-discovery/pr-body.md
          draft: false
          reviewers: diegolinan
          add-paths: data/evidence-discovery/candidates.jsonl
      - name: Report discovery workflow failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/notifications/report-workflow-failure.mjs
