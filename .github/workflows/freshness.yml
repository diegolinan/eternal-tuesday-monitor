name: Reevaluate freshness and deploy Pages

on:
  schedule:
    - cron: '17 12 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm test
      - name: Derive the explicit evaluation date
        id: evaluation
        shell: bash
        run: |
          today="$(date -u +%F)"
          as_of="$(node scripts/resolve-evaluation-date.mjs --today "$today")"
          echo "as_of=$as_of" >> "$GITHUB_OUTPUT"
      - name: Compile derived state without changing evidence dates
        run: npm run data:compile -- --as-of "${{ steps.evaluation.outputs.as_of }}"
      - name: Compile neutral public status
        env:
          SYSTEM_STATUS_TOKEN: ${{ github.token }}
          SYSTEM_STATUS_REPOSITORY: ${{ github.repository }}
        run: npm run status:compile
      - run: npm run build:pages
      - run: npm run static:validate
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy evaluated static site
        id: deployment
        uses: actions/deploy-pages@v4
